# GPIO Configuration Test
# Tests all modes of the sky130_gpio_config IP:
#   - OUTPUT mode (GPIOs 2-5)
#   - INPUT no-pull mode (GPIOs 6-9)
#   - INPUT_PD pull-down mode (GPIOs 10-13)
#   - INPUT_PU pull-up mode (GPIOs 14-17)
#   - BIDIR bidirectional mode (GPIOs 18-21)

Tests:
    - {name: gpio_config_test, sim: RTL}
